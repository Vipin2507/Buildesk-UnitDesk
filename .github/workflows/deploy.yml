name: Deploy UnitDesk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-unitdesk
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ".,!.git,!node_modules,!dist,!.env,!uploads,!prisma/*.db,!prisma/*.db-journal,.env.example"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          strip_components: 0

      - name: Install, build, restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "Missing .env in $APP_DIR — create it on the server first."
              exit 1
            fi

            mkdir -p uploads
            npm ci
            npx prisma generate
            npx tsx scripts/migrate-booking-financials.ts
            npx prisma db push
            npm run build

            export NODE_ENV=production
            if pm2 describe unitdesk >/dev/null 2>&1; then
              pm2 restart unitdesk --update-env
            else
              pm2 start npm --name unitdesk --cwd "$APP_DIR" -- start
              pm2 save
            fi

            sleep 2
            APP_PORT="$(grep -E '^PORT=' .env | cut -d= -f2 | tr -d '\"' || true)"
            curl -sf "http://127.0.0.1:${APP_PORT:-3101}/api/health"
            echo
            echo "Deploy OK"
