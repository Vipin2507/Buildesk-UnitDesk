name: Deploy UnitDesk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-unitdesk
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload app to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: ".,!.git,!node_modules,!dist,!.env,!uploads,!prisma/*.db,!prisma/*.db-journal"
          target: ${{ secrets.DEPLOY_PATH }}
          rm: false
          strip_components: 0
          overwrite: true

      - name: Install, build, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "Missing .env in $APP_DIR"
              echo "Create it once on the server from .env.example before deploying."
              exit 1
            fi

            mkdir -p uploads
            npm ci
            npx prisma generate
            npx prisma db push
            npm run build

            export NODE_ENV=production
            if command -v pm2 >/dev/null 2>&1; then
              if pm2 describe unitdesk >/dev/null 2>&1; then
                pm2 restart unitdesk --update-env
              else
                pm2 start npm --name unitdesk --cwd "$APP_DIR" -- start
                pm2 save
              fi
            else
              echo "PM2 missing — restart the Node app from CloudPanel UI."
            fi

            sleep 2
            curl -sf http://127.0.0.1:3001/api/health || true
            echo "Deploy OK"
